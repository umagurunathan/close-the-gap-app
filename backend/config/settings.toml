# Close the Gap: tunable settings.
#
# Change a number or a word list here, restart the backend, and the app follows. No code change needed.
# To try a different file: set the environment variable SETTINGS_PATH to its location.
#
# Each section says whether it is "wired" (the app already reads it) or "reserved" (agreed in the design and kept
# here so it can be tuned later; the feature that reads it is not built yet).
#
# Deliberately NOT here, because they are product rules and not tuning knobs: the privacy filter (a person's AI only
# reads summaries that person can open), "the AI proposes and a person decides", only the organizer can reschedule or
# cancel, one occurrence at a time, optional attendees never trigger anything, who counts as a key person
# (the organizer plus required attendees), and the five actions.


# ---------------------------------------------------------------- Reminders
[reminders]
# RESERVED (the digest job is the next build; Decision 50).
# Hours before a meeting starts at which a still-unresolved meeting is reminded about. A meeting created later than a
# milestone never gets that milestone (no backfill).
milestones_hours_before_meeting = [168, 72, 24, 4, 2]   # 7 days, 3 days, 24 hours, 4 hours, 2 hours
# Who receives each digest. "leaver" = the person who is out; "organizer" = the meeting organizer.
recipients = ["leaver", "organizer"]
# One email per person per milestone listing everything still unresolved (true), or one email per meeting (false).
send_as_digest = true
# How often the scheduler runs the reminder job. Cloud Scheduler is set to this; the job is safe to run more often.
job_interval_minutes = 15

# WIRED today:
# How many times a silent proxy is reminded before the organizer simply decides.
proxy_max_reminders = 3
# The current organizer alert: a meeting starting within this many hours that still needs action. The 24-hour digest
# milestone will replace this when the digest job is built.
organizer_alert_hours = 24


# ---------------------------------------------------------------- Urgency chips (WIRED)
[urgency]
soon_hours = 72      # amber chip: the meeting starts within this many hours and still needs action
urgent_hours = 24    # red "act now" chip


# ---------------------------------------------------------------- Absences (WIRED)
[absence]
# An absence reported with less notice than this is "sudden" (the organizer is emailed at once). Otherwise "planned".
sudden_notice_hours = 24


# ---------------------------------------------------------------- What stays visible (WIRED)
[visibility]
past_days = 30       # a finished meeting stays in the Past tab this long
history_days = 30    # activity log entries shown to a person


# ---------------------------------------------------------------- Reschedule search (WIRED; plain code, no AI)
[reschedule]
preferred_window_hours = 1   # first try the same time of day, within +/- this many hours
wider_window_hours = 2       # then widen to +/- this many hours (flagged as "a little off the original time")
step_minutes = 30            # candidate times are this far apart
max_working_days = 7         # how many working days ahead to look
skip_weekends = true


# ---------------------------------------------------------------- Directory search for proxies (WIRED)
[directory]
max_results = 20


# ---------------------------------------------------------------- "Minutes saved" metric (WIRED)
# Modeled, illustrative assumptions per attendee. Replace with the team's real numbers when confirmed.
[metrics]
minutes_lost_in_failed_meeting = 6
minutes_lost_in_follow_up = 30


# ---------------------------------------------------------------- Recommender word lists (WIRED; stand-in rules, the
# AI reads the meeting itself once it replaces them, but the words stay useful as hints and as the fallback)
[recommendation]
team_checkin_title_words = ["stand-up", "standup", "stand up", "dsu", "daily status", "status check", "check-in", "sync"]
decision_words = ["decid", "decision", "approve", "owns", "owner", "action item", "to confirm", "sign off", "sign-off"]
# Words that, next to the absent person's name, mean they run an org-wide event (Decisions 48 and 55)
hosting_words = ["host", "emcee", "speaker", "presenter", "moderator", "organis", "organiz", "committee", "co-ordinat", "coordinat", "keynote", "guest", "panel"]
# A meeting with more required invitees than this is a large event: ordinary attendees are not key people, only the
# organizer and people in a hosting role (Decision 55). Invites to a distribution list are always large events.
large_meeting_required_threshold = 15
# A proxy suggestion needs at least this score to be called "high confidence" (see proxy_ranking below)
min_proxy_score_for_high_confidence = 10


# ---------------------------------------------------------------- Proxy ranking weights (WIRED; stand-in rules)
[proxy_ranking]
named_in_summaries_base = 10   # plus one point per mention
absent_persons_manager = 3
peer_same_manager = 2
direct_report = 2


# ---------------------------------------------------------------- Handover note drafter (WIRED; stand-in rules)
[drafter]
key_words = ["decid", "decision", "approve", "owns", "owner", "action item", "to confirm", "sign off", "sign-off", "to prepare"]
max_bullets = 5
fallback_sentences = 2


# ---------------------------------------------------------------- AI (WIRED; Gemini through Vertex AI)
[ai]
# WIRED: false = the rule-based stand-ins decide (no network, used by the tests); true = Gemini decides.
enabled = false
# PROVISIONAL (decision A8): pick after comparing quality, speed and cost on our task. Run scripts/hello_gemini.py --list
# to see what the project can use.
model = "gemini-2.5-flash"
# Where Vertex AI serves the model from. "global" is the safest for the newest models; a region such as
# "asia-south1" can be tried for lower latency.
location = "global"
timeout_seconds = 20
# "Thinking" makes the model reason before answering: better for hard problems, slower. 0 = off (our task is a short
# classification). Raise it if answers look shallow. Measure before changing (A8).
thinking_budget = 0
# false = cards are created with the rule-based answer and Gemini is asked the first time a card is viewed (then cached),
# so startup and creating an absence never wait for the AI. First step of B22; the background queue comes next.
analyse_on_creation = false
# WIRED (Block 4; Uma 2026-10-13, to revisit with the team): try a few times on temporary errors (too many requests,
# Google-side errors, timeouts), waiting between tries; then show the rule-based answer labelled "AI unavailable".
attempts = 3
retry_wait_seconds = [1, 3]
# RESERVED (B22, background analysis): how long a card may say "AI analysing…" before it shows
# "AI unavailable · rule-based suggestion" instead (the analysis keeps running and the card updates later). Uma 2026-10-13.
analysing_label_max_seconds = 20
fall_back_to_rules = true
# Below this confidence the AI may not mark a meeting a team check-in or an org-wide event; it becomes a key meeting.
auto_handle_requires = "high"
# WIRED (the checking layer, agents/guard.py): a proxy suggested with no summaries to support it can be at most this confident.
# A conclusion drawn from the title or agenda alone (for example "Testing session with Priya") is NOT capped.
max_confidence_for_proxy_without_summaries = "low"
# The AI never sees the whole invitee list (Decision 55): only the count, plus at most this many likely candidates
# (people named in the summaries first, then the reporting line, then the organizer, then others).
max_candidates = 20
