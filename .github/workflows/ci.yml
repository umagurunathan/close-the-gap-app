# Runs on every pull request (and on main): the backend tests and the web app build. The pull request shows a green
# tick or a red cross before anyone merges. The tests need no Google account: the AI is switched off or faked.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          AI_ENABLED: "false"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # The app in a real browser: the backend (sample data, AI off) and the built web app side by side, then e2e/smoke.py
  # loads the demo, opens a card and the main panels, and fails on any console error.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r backend/requirements.txt playwright==1.64.0 && python -m playwright install --with-deps chromium
      - name: Start the backend
        working-directory: backend
        env:
          STORE: memory
          AI_ENABLED: "false"
        run: nohup python -m uvicorn app.main:app --port 8000 > backend.log 2>&1 &
      - name: Build and serve the web app
        working-directory: web
        env:
          VITE_API_URL: http://localhost:8000
        run: |
          npm ci
          npm run build
          nohup npm run preview -- --port 5173 --strictPort > preview.log 2>&1 &
      - name: Wait for both
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health && curl -sf http://localhost:5173 > /dev/null && exit 0; sleep 1; done
          cat backend/backend.log web/preview.log; exit 1
      - run: python web/e2e/smoke.py
